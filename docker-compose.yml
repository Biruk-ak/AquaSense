version: '3.9'
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aquasense
      POSTGRES_PASSWORD: aquasense_dev
      POSTGRES_DB: aquasense
    ports: ['5432:5432']
    volumes: [aquasense_pg:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
volumes:
  aquasense_pg:
